<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      // The site defaults to dark; a stored preference overrides it.
      (function () {
        try {
          if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          // localStorage unavailable (private browsing, disabled storage) — falls back to dark.
        }
      })();
    </script>
    <meta name="description" content="Jeanmarcos Perez — Software Developer. Dartmouth CS grad building projects with React, Python, Java, and C.">
    <title>Jeanmarcos Perez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

  </head>
